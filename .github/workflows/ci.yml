name: CI

# `master`, not `main`: this repository's default branch is master (origin/HEAD -> origin/master) and no
# branch named main has ever existed, so both triggers below matched nothing and CI had never run on a
# push or a pull request — only the manual workflow_dispatch could start it. Every gate in this file,
# including the committed-bundle freshness check, was therefore silently absent from code review.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Needed because the build below rebuilds the client bundle from TypeScript rather than trusting the
      # committed one. The cache key is the lockfile: Client/ is the only npm project in the repo.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/Raptor21.RCL/Client/package-lock.json

      - name: Restore
        run: dotnet restore Raptor21.slnx

      # RaptorBuildClient=true runs `npm ci && npm run build` in Client/ before compiling. wwwroot/dist is
      # not committed (it is a build output), so this is the only way a bundle exists on the runner, and
      # what CI verifies is always the bundle built from source.
      - name: Build
        run: dotnet build Raptor21.slnx -c Release --no-restore -p:RaptorBuildClient=true

      # Holds, among others, the RFC 0001 parity contract: the route convention lives both in the runtime
      # scanner and (as a copy) in the netstandard2.0 source generator, and the tests fail if they drift.
      - name: Test
        run: dotnet test Raptor21.slnx -c Release --no-build

      - name: TypeScript typecheck
        working-directory: src/Raptor21.RCL/Client
        run: npm run typecheck

      - name: Pack
        run: dotnet pack Raptor21.slnx -c Release --no-build -o artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: artifacts/*.nupkg
