name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    # Required by the nuget.org trusted-publishing policy, which will not mint a token for a job that runs
    # outside the environment it names. It is also the boundary worth having: publishing is the one step
    # here that cannot be undone, so it belongs somewhere approval rules can be attached.
    environment: production

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/Raptor21.RCL/Client/package-lock.json

      - name: Derive version from tag
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build
        run: >
          dotnet build Raptor21.slnx -c Release
          -p:RaptorBuildClient=true
          -p:Version=${{ steps.version.outputs.value }}

      - name: Pack
        run: >
          dotnet pack Raptor21.slnx -c Release --no-build -o artifacts
          -p:Version=${{ steps.version.outputs.value }}

      - name: Authenticate to NuGet (Trusted Publishing)
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push to NuGet
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Attach packages to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.nupkg
            artifacts/*.snupkg
          generate_release_notes: true
          # SemVer says a hyphen opens the pre-release field, so v1.2.3-preview.1 is a pre-release and
          # v1.2.3 is not. The action does not infer this from the tag, and an unmarked pre-release shows
          # up as "Latest" on the repository's front page — which is the version people then install.
          prerelease: ${{ contains(github.ref_name, '-') }}
