name: Release

# Tag-driven: `git tag v0.1.0 && git push --tags` publishes 0.1.0. The tag is the single source of the
# version, so the number in the csproj never has to be kept in sync by hand — and a package can never be
# published from a commit that was not tagged for it.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/Raptor21.RCL/Client/package-lock.json

      - name: Derive version from tag
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build
        run: >
          dotnet build Raptor21.slnx -c Release
          -p:RaptorBuildClient=true
          -p:Version=${{ steps.version.outputs.value }}

      - name: Pack
        run: >
          dotnet pack Raptor21.slnx -c Release --no-build -o artifacts
          -p:Version=${{ steps.version.outputs.value }}

      # --skip-duplicate so re-running a failed release job is safe: a version already on nuget.org is
      # left alone instead of failing the run. nuget.org never allows overwriting a published version.
      - name: Push to NuGet
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key ${{ secrets.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Attach packages to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.nupkg
            artifacts/*.snupkg
          generate_release_notes: true
